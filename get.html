<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Doulia</title>
<meta name="description" content="Download Doulia, the app for small jobs in Cyprus.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Doulia">
<meta property="og:title" content="Get Doulia · Small jobs, done by people nearby">
<meta property="og:description" content="Download Doulia for iPhone and Android. Μικροδουλειές, από ανθρώπους κοντά σας.">
<meta property="og:image" content="https://doulia.me/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%230A6E8A'/%3E%3Cpath d='M48 80c-12-14-22-24-22-38a22 22 0 0 1 44 0c0 14-10 24-22 38z' fill='%23fff'/%3E%3C/svg%3E">
<script src="/store-links.js"></script>
<script>
  // Store links live in store-links.js (one place for every page).
  var IOS_URL = (window.DOULIA_LINKS || {}).ios || '';
  var ANDROID_URL = (window.DOULIA_LINKS || {}).android || '';
  (function () {
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    var isAndroid = /Android/i.test(ua);
    if (isIOS && IOS_URL) location.replace(IOS_URL);
    else if (isAndroid && ANDROID_URL) location.replace(ANDROID_URL);
  })();
</script>
<style>
  :root { --sea:#0A6E8A; --sea-dark:#07526A; --ink:#1B1F24; --soft:#5B6470; --line:#E3E6EA; --tint:#DCEBEF; --bg:#F1F3F5; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#E9EDF0; --soft:#9AA4AE; --line:#2B3139; --tint:#123540; --bg:#0F1215; --card:#1A1F24; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center; }
  .logo { display:inline-flex; align-items:center; gap:10px; font-size:28px; font-weight:700; letter-spacing:-.6px; color:var(--ink); text-decoration:none; }
  .logo em { font-style:normal; font-weight:400; color:var(--sea); }
  h1 { font-size:22px; line-height:1.3; margin:20px 0 8px; }
  p { color:var(--soft); font-size:15px; line-height:1.5; margin:0 0 22px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; min-height:54px; border-radius:14px; font-size:16px; font-weight:600; text-decoration:none; margin-top:10px; }
  .btn.on { background:var(--sea); color:#fff; }
  .btn.off { background:var(--tint); color:var(--sea-dark); cursor:default; }
  @media (prefers-color-scheme: dark) { .btn.off { color:#86CDE0; } }
  .btn small { font-weight:500; opacity:.85; }
  .home { display:inline-block; margin-top:22px; color:var(--sea); font-weight:600; font-size:15px; text-decoration:none; padding:8px; }
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="Doulia home">
    <svg width="44" height="44" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24" fill="#0A6E8A"/><path d="M48 80c-12-14-22-24-22-38a22 22 0 0 1 44 0c0 14-10 24-22 38z" fill="#fff"/><path d="M38 42l7 7 13-14" fill="none" stroke="#0A6E8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>doulia<em>.me</em></span>
  </a>
  <h1 id="title">Small jobs, done by people nearby</h1>
  <p id="lead">Download Doulia for your phone.</p>
  <div id="buttons"></div>
  <a class="home" id="home" href="/">Visit doulia.me</a>
</main>
<script>
  (function () {
    var el = /^el\b/i.test(navigator.language || '');
    var T = el ? {
      title: 'Μικροδουλειές, από ανθρώπους κοντά σας',
      lead: 'Κατεβάστε το Doulia στο κινητό σας.',
      soon: 'Έρχεται σύντομα',
      home: 'Επισκεφθείτε το doulia.me'
    } : {
      title: 'Small jobs, done by people nearby',
      lead: 'Download Doulia for your phone.',
      soon: 'Coming soon',
      home: 'Visit doulia.me'
    };
    if (el) document.documentElement.lang = 'el';
    document.getElementById('title').textContent = T.title;
    document.getElementById('lead').textContent = T.lead;
    document.getElementById('home').textContent = T.home;
    function btn(name, url) {
      var a = document.createElement(url ? 'a' : 'div');
      a.className = 'btn ' + (url ? 'on' : 'off');
      if (url) a.href = url;
      a.innerHTML = name + (url ? '' : ' <small>· ' + T.soon + '</small>');
      return a;
    }
    var box = document.getElementById('buttons');
    box.appendChild(btn('App Store (iPhone)', IOS_URL));
    box.appendChild(btn('Google Play (Android)', ANDROID_URL));
  })();
</script>
</body>
</html>
