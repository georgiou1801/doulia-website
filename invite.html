<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited to Doulia</title>
<meta name="description" content="Join Doulia, the app for small jobs in Cyprus, with a friend's invite code.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Doulia">
<meta property="og:title" content="You're invited to Doulia · Είστε καλεσμένοι στο Doulia">
<meta property="og:description" content="Small jobs, done by people nearby. Μικροδουλειές, από ανθρώπους κοντά σας.">
<meta property="og:image" content="https://doulia.me/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='24' fill='%230A6E8A'/%3E%3Cpath d='M48 80c-12-14-22-24-22-38a22 22 0 0 1 44 0c0 14-10 24-22 38z' fill='%23fff'/%3E%3C/svg%3E">
<script src="/store-links.js"></script>
<style>
  :root { --sea:#0A6E8A; --sea-dark:#07526A; --ink:#1B1F24; --soft:#5B6470; --line:#E3E6EA; --tint:#DCEBEF; --bg:#F1F3F5; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#E9EDF0; --soft:#9AA4AE; --line:#2B3139; --tint:#123540; --bg:#0F1215; --card:#1A1F24; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; text-align:center; }
  .logo { display:inline-flex; align-items:center; gap:10px; font-size:28px; font-weight:700; letter-spacing:-.6px; color:var(--ink); text-decoration:none; }
  .logo em { font-style:normal; font-weight:400; color:var(--sea); }
  h1 { font-size:22px; line-height:1.3; margin:22px 0 8px; }
  p { color:var(--soft); font-size:15px; line-height:1.5; margin:0 0 18px; }
  .code { background:var(--tint); border-radius:16px; padding:16px; margin:0 0 10px; }
  .code small { display:block; font-size:13px; font-weight:600; color:var(--soft); margin-bottom:4px; }
  .code b { font-size:34px; letter-spacing:6px; color:var(--sea-dark); font-variant-numeric:tabular-nums; }
  @media (prefers-color-scheme: dark) { .code b { color:#86CDE0; } }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; border-radius:14px; font-size:16px; font-weight:600; text-decoration:none; margin-top:10px; border:0; cursor:pointer; font-family:inherit; }
  .btn.on { background:var(--sea); color:#fff; }
  .btn.line { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.off { background:var(--tint); color:var(--sea-dark); cursor:default; }
  @media (prefers-color-scheme: dark) { .btn.off { color:#86CDE0; } }
  .btn small { font-weight:500; opacity:.85; }
  .note { font-size:13px; margin:14px 0 0; }
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="Doulia home">
    <svg width="44" height="44" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="24" fill="#0A6E8A"/><path d="M48 80c-12-14-22-24-22-38a22 22 0 0 1 44 0c0 14-10 24-22 38z" fill="#fff"/><path d="M38 42l7 7 13-14" fill="none" stroke="#0A6E8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>doulia<em>.me</em></span>
  </a>
  <h1 id="title">A friend invited you to Doulia</h1>
  <p id="lead">Post small jobs for free, or earn money helping people nearby.</p>
  <div class="code" id="codeBox"><small id="codeLabel">Your invite code</small><b id="code">——</b></div>
  <button class="btn line" id="copy" type="button">Copy code</button>
  <a class="btn on" id="open" href="#">Open in Doulia</a>
  <div id="stores"></div>
  <p class="note" id="note">New here? Install the app and enter the code when you sign up.</p>
</main>
<script>
  (function () {
    var L = window.DOULIA_LINKS || {};
    var el = /^el\b/i.test(navigator.language || '');
    var T = el ? {
      title: 'Ένας φίλος σας κάλεσε στο Doulia',
      lead: 'Αναρτήστε μικροδουλειές δωρεάν ή βγάλτε χρήματα βοηθώντας ανθρώπους κοντά σας.',
      codeLabel: 'Ο κωδικός πρόσκλησής σας', copy: 'Αντιγραφή κωδικού', copied: 'Αντιγράφηκε ✓',
      open: 'Άνοιγμα στο Doulia', soon: 'Έρχεται σύντομα',
      note: 'Νέος χρήστης; Εγκαταστήστε την εφαρμογή και βάλτε τον κωδικό στην εγγραφή.'
    } : {
      title: 'A friend invited you to Doulia',
      lead: 'Post small jobs for free, or earn money helping people nearby.',
      codeLabel: 'Your invite code', copy: 'Copy code', copied: 'Copied ✓',
      open: 'Open in Doulia', soon: 'Coming soon',
      note: 'New here? Install the app and enter the code when you sign up.'
    };
    if (el) document.documentElement.lang = 'el';
    // doulia.me/invite/ABC234  (also works as doulia.me/invite.html?code=ABC234)
    var fromPath = (location.pathname.match(/\/invite\/([A-Za-z0-9]{4,8})/) || [])[1];
    var fromQuery = new URLSearchParams(location.search).get('code');
    var code = String(fromPath || fromQuery || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    ['title', 'lead', 'codeLabel', 'note'].forEach(function (k) { document.getElementById(k).textContent = T[k]; });
    document.getElementById('code').textContent = code || '——';
    var copy = document.getElementById('copy');
    copy.textContent = T.copy;
    copy.onclick = function () {
      var done = function () { copy.textContent = T.copied; setTimeout(function () { copy.textContent = T.copy; }, 2000); };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done); else done();
    };
    var open = document.getElementById('open');
    open.textContent = T.open;
    open.href = (L.app || 'douliaapp://') + 'join/' + code;
    if (!code) { document.getElementById('codeBox').style.display = 'none'; copy.style.display = 'none'; open.style.display = 'none'; }
    function storeBtn(name, url) {
      var a = document.createElement(url ? 'a' : 'div');
      a.className = 'btn ' + (url ? 'line' : 'off');
      if (url) a.href = url;
      a.innerHTML = name + (url ? '' : ' <small>· ' + T.soon + '</small>');
      return a;
    }
    var s = document.getElementById('stores');
    s.appendChild(storeBtn('App Store (iPhone)', L.ios));
    s.appendChild(storeBtn('Google Play (Android)', L.android));
  })();
</script>
</body>
</html>
